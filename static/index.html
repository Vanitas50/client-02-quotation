<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>HansePack Angebotsrechner</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 1rem; }
  h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
  .disclaimer { color: #666; font-style: italic; margin-bottom: 1.5rem; }
  .form-group { margin-bottom: 1rem; }
  label { display: block; margin-bottom: 0.25rem; font-weight: bold; }
  select, input[type="text"] { width: 100%; padding: 0.5rem; box-sizing: border-box; }
  .row-controls { margin-top: 0.5rem; display: flex; gap: 0.5rem; }
  button { cursor: pointer; padding: 0.5rem 1rem; border: none; border-radius: 4px; font-size: 0.9rem; }
  .btn-add { background-color: #28a745; color: white; }
  .btn-remove { background-color: #dc3545; color: white; }
  .btn-calc { background-color: #007bff; color: white; width: 100%; margin-top: 1rem; padding: 0.75rem; font-size: 1rem; }
  .btn-download { background-color: #17a2b8; color: white; margin-top: 1rem; }
  table { width: 100%; border-collapse: collapse; margin-top: 1.5rem; display: none; }
  th, td { border: 1px solid #ddd; padding: 0.5rem; text-align: left; font-size: 0.9rem; }
  th { background-color: #f4f4f4; }
  .error-msg { color: #dc3545; margin-top: 1rem; display: none; padding: 1rem; border: 1px solid #dc3545; border-radius: 4px; }
</style>
</head>
<body>
  <h1>HansePack Angebotsrechner</h1>
  <p class="disclaimer">Nettobeträge – Lehrprojekt, kein verbindliches Angebot</p>

  <div id="items-container"></div>
  
  <button class="btn-add" onclick="addItem()">+ Position</button>
  <button class="btn-calc" onclick="calculateQuote()">Angebot berechnen</button>
  <button class="btn-download" id="download-btn" style="display:none;" onclick="exportJSON()">JSON herunterladen</button>

  <div id="error-msg" class="error-msg"></div>

  <table id="result-table">
    <thead>
      <tr>
        <th>SKU</th>
        <th>Menge</th>
        <th>Einzelpreis (ct)</th>
        <th>Listenbetrag (ct)</th>
        <th>Rabatt (%)</th>
        <th>Rabatt (ct)</th>
        <th>Netto (ct)</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>

  <div style="margin-top: 1rem; display:none;" id="totals-section">
    <p><strong>Währung / Regelversion:</strong> <span id="currency">EUR</span> / <span id="rule-version">HP-V1</span></p>
    <p><strong>Warenwert (Netto):</strong> <span id="goods-net">0</span> ct</p>
    <p><strong>Versand:</strong> <span id="shipping">0</span> ct</p>
    <p><strong>Gesamt (Netto):</strong> <span id="total">0</span> ct</p>
  </div>

  <script>
    let catalogProducts = [
      { sku: 'HP-BOX', name_de: 'Versandkarton', unit_price_cents: 250 },
      { sku: 'HP-TAPE', name_de: 'Klebeband', unit_price_cents: 400 },
      { sku: 'HP-FILM', name_de: 'Stretchfolie', unit_price_cents: 1250 }
    ];
    let lastValidPayload = null;

    function parseQuantityRaw(raw) {
      const trimmed = String(raw).trim();
      if (trimmed === '') return '';
      if (/^-?\d+$/.test(trimmed)) return Number(trimmed);
      if (/^-?\d+\.\d+$/.test(trimmed)) return Number(trimmed);
      return raw;
    }

    function addItem(defaultSku = 'HP-BOX', defaultQty = '50') {
      const container = document.getElementById('items-container');
      if (container.children.length >= 3) return;
      const div = document.createElement('div');
      div.className = 'form-group';
      const optionsHtml = catalogProducts
        .map(p => `<option value="${p.sku}" ${p.sku === defaultSku ? 'selected' : ''}>${p.sku} – ${p.name_de} (${p.unit_price_cents} ct)</option>`)
        .join('');
      div.innerHTML = `
        <label>Produkt</label>
        <select class="sku-input">${optionsHtml}</select>
        <label>Menge</label>
        <input type="text" class="qty-input" value="${defaultQty}" placeholder="z.B. 50">
        <div class="row-controls">
          <button type="button" class="btn-remove" onclick="removeItem(this)">Entfernen</button>
        </div>
      `;
      container.appendChild(div);
    }

    function removeItem(btn) {
      btn.closest('.form-group').remove();
    }

    function collectPayload() {
      const rows = document.querySelectorAll('#items-container .form-group');
      const items = Array.from(rows).map(row => ({
        sku: row.querySelector('.sku-input').value,
        quantity: parseQuantityRaw(row.querySelector('.qty-input').value)
      }));
      return { items, rule_version: 'HP-V1' };
    }

    async function calculateQuote() {
      const payload = collectPayload();
      try {
        const response = await fetch('/api/quote', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        if (!response.ok) {
          const errObj = data.error || {};
          showError(errObj.message || 'Fehler bei der Berechnung.');
          return;
        }

        lastValidPayload = payload;
        displayResults(data);
      } catch (e) {
        showError('Netzwerkfehler oder Server nicht erreichbar.');
      }
    }

    function displayResults(data) {
      document.getElementById('error-msg').style.display = 'none';
      document.getElementById('result-table').style.display = 'table';
      document.getElementById('download-btn').style.display = 'inline-block';
      document.getElementById('totals-section').style.display = 'block';

      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';

      (data.lines || []).forEach(line => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${line.sku}</td>
          <td>${line.quantity}</td>
          <td>${line.unit_price_cents}</td>
          <td>${line.list_amount_cents}</td>
          <td>${line.discount_percent}%</td>
          <td>${line.discount_cents}</td>
          <td>${line.net_cents}</td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('currency').textContent = data.currency;
      document.getElementById('rule-version').textContent = data.rule_version;
      document.getElementById('goods-net').textContent = data.goods_net_cents;
      document.getElementById('shipping').textContent = data.shipping_cents;
      document.getElementById('total').textContent = data.total_cents;
    }

    function showError(msg) {
      lastValidPayload = null;
      document.getElementById('result-table').style.display = 'none';
      document.getElementById('download-btn').style.display = 'none';
      document.getElementById('totals-section').style.display = 'none';
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.style.display = 'block';
    }

    async function exportJSON() {
      if (!lastValidPayload) return;
      try {
        const response = await fetch('/api/quote/export', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(lastValidPayload)
        });
        if (!response.ok) {
          const data = await response.json();
          showError((data.error && data.error.message) || 'Export fehlgeschlagen');
          return;
        }
        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'hansepack-angebot-HP-V1.json';
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(url);
      } catch (e) {
        showError('Fehler beim Herunterladen: ' + e.message);
      }
    }

    async function init() {
      try {
        const resp = await fetch('/api/catalog');
        if (resp.ok) {
          const data = await resp.json();
          if (Array.isArray(data.products) && data.products.length > 0) {
            catalogProducts = data.products;
          }
        }
      } catch (_) {}
      addItem('HP-BOX', '50');
    }

    init();
  </script>
</body>
</html>
